<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 01</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 400px;
            border-collapse: collapse;
        }
        caption {
            font-size: 1.5em;
            font-weight: bolder;
            background-color: lightgray;
            padding: 3px;
        }

        .forte {
            background-color: gray;
            color: aliceblue;
            font-weight: bold;
        }

        table  td,th{
            border: 1px solid black;
            padding: 5px;
        }
    </style>
</head>
<body>
    <table>
        <caption>Notas de Cada Disciplina</caption>
        <thead>
            <tr>
                <th rowspan="2" class="forte" scope="col">Área</th>
                <th rowspan="2" class="forte" scope="col">Disciplinas</th>
                <th colspan="2" class="forte" scope="colgroup">Notas</th>
                <th rowspan="2" class="forte" scope="col">Média</th>
            </tr>
            <tr>
                <th class="forte" scope="col">Nota1</th>
                <th class="forte" scope="col">Nota2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th colspan="4" class="forte" scope="row">Média de Exatas</th>
                <td class="forte">0.0</td>
            </tr>
            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th colspan="4" class="forte" scope="row">Média de Humanas</th>
                <td class="forte">0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
