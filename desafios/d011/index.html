<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar centralização de imagens vertical</title>
    <style>
        body {
            position: relative;
            height: 96vh;   
            padding: 10px;
            background-image: url('imagens/espaco.jpg');
            background-size: 100% 100%;
        }

        #conteudo {
            background-image: url('imagens/astronauta.png');
            background-size: 100% 100%;
            position: absolute;
            height: 200px;
            width: 300px;
            left: 50%;
            top: 50%;

            translate: -50% -50%;
        }

        
    </style>
</head>
<body>
    <section id="container">
        <article id="conteudo"></article>
    </section>
</body>
</html>
