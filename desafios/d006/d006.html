<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Tags em HTML</h1>

    <p>Em HTML5, podemos inserir os elementos de uma lista a seguir. Passe o mouse <br>
        sobre os termos para descobrir qual tag deverá usar em cada caso.
    </p>

    <ul style="list-style: square;">
        <li><abbr title="Use a tag <p>">Parágrafo</abbr></li>
        <li><abbr title="Contem uma hierarquia de <h1> para <h5> apenas use essas tags">Título</abbr></li>
        <li><abbr title="Use a tag <img>">Imagens</abbr></li>
        <li><abbr title="Use a tag <abbr>">Abreviações</abbr></li>
        <li><abbr title="Ultilize a tag <code> se quiser deixar mais bonito use <pre>">Códigos-fonte</abbr></li>
        <li><abbr title="Use <ol type='1'> ou <ul> apos disso use <li>">Listas numeradas</abbr></li>
        <li><abbr title="Use a tag <dl>">Listas com demarcadores</abbr></li>
    </ul>
</body>

</html>
