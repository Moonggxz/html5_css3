<!DOCTYPE html>
<html lang="pt-bt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        * {
            /* Configurações globais das CSS */
            height: 100%
        }

        body {
            background-image: linear-gradient(200deg, #FE02B9 10%,#F205E2 20%,#870EFF,#FF470C,#FFC303);
            background-attachment: fixed;
        }
    </style>
</head>

<body>
    <h1>Testando Gradientes</h1>
</body>

</html>
