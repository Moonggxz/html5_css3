<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de imagem de fundo (Background Image)</title>
    <style>
        body {
            background-image: url('imagens/wallpaper001.jpg');
        }

        div#quadrado_mega {
            background-color: aliceblue;
            padding: 10px;
            min-width: 320px;
            max-width: 1000px;
            margin: auto;
            border: 2px solid black;
            border-radius: 10px;
        }

        div.quadrado {
            border: 2px solid black;
            border-radius: 10px;
            background-color: lightgray;
            width: 300px;
            height: 300px;
            margin: 10px auto 10px auto;

        }

        div#q1 {
           background-color: rgb(174, 252, 210);      
        }
        
        div#q2 {
            background-image: linear-gradient(to bottom, yellow, orange);
        }

        div#q3 {
            background-image: url('imagens/pattern003.png');

        }

        div#q4 {
            background-image: url('imagens/pattern001.png');
        }

        div#q1:hover {
            cursor: pointer;
            background-color: cyan;
            transition-duration: 1s;

        }

        div.imagens_bloco {
            width: 100%;
        }
        

    </style>
</head>

<body>
    <div id="quadrado_mega">
        <div class="quadrado" id="q1">
        </div>
        <div class="quadrado" id="q2">
        </div>
        <div>
        </div>
        <div class="quadrado" id="q3" class="imagens_bloco">
        </div>
        <div class="quadrado" id="q4" class="imagens_bloco">
        </div>
    </div>
</body>

</html>
