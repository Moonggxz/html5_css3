<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML5</title>
</head>

<body>
    <h1>Inserindo vídeo hospedados localmente</h1>
    <p>Este vídeo esta hospedado no meu proprio e unico <b>servidor</b></p>

    <video width="250" poster="imagens/seila.jpg" controls loop>
        <source src="midia/meu_video.mov" type="video/quicktime">
        <source src="midia/meu_video.mp4" type="video/mp4">
        <p>Seu navegador não tem compatibilidade com reprodução de vídeos.
        </p>
    </video>

    <h1>inserindo vídeos do <b>Youtube</b></h1>
    <iframe width="900" height="550" src="https://www.youtube.com/embed/6PjWW_d7i2A?si=GeB-KvjsqFKQl4zH"
        title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write;
    encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen></iframe>
</body>

</html>
