<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borda "personalizada"</title>
    <style>
        h1 {
            border: 5px dashed black;
            margin: auto;
            width: 200px;
            padding: 10px 10px 10px 10px;
        }

        #algumacoisa:hover {
            cursor: pointer;
            background-color: black;
            color: aliceblue;
            width: 300px;
        }

        p > #algumacoisa {
            display: none;
        }
    </style>
</head>

<body>
    <h1>Teste borda</h1>
    <p id="algumacoisa">Passe mouse aqui para aparecer algo</p>
    <p>Segredo</p>
</body>

</html>
