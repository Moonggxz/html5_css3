<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links no HTML5</title>
    <style>
        /* SELETORES PERSONALIZADOS
            id = #
            class = .
            pseudo-class = :
            pseudo-elements = ::
            children = >
        */
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: crimson;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: darkred;
        }

        a:hover {
            text-decoration: underline;
            color: black;
        }

        a:active {
            color: yellow;
        }

        .especial {
            background-color: rgba(245, 88, 88, 0.562);
        }

        .especial::before {
            content: '→ ';
        }

        .especial::after {
            content: ' ←';
        }
    </style>
</head>

<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://github.com/Moonggxz" rel="external" target="_blank" class="especial">Repositorio GitHub</a>
        </li>
        <li><a href="https://www.youtube.com/@Moonfofinhamine" rel="external" target="_blank" class="especial">Canal do
                Youtube</a></li>
        <li><a href="https://www.roblox.com/users/1569320591/profile" rel="external" target="_blank">Minha conta do
                Roblos</a></li>
    </ul>
</body>

</html>
