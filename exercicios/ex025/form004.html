<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }

        fieldset {
            text-align: center;
            max-width: 400px;
            margin: auto;
            border-radius: 10px;
        }

        

        div {
            padding: 10px;
        }
    
    </style>
</head>
<body>
    <h1>Exemplos de Forms</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Dados pessoais</legend>
            <div>
                <label for="inome">Nome:</label>
                <input type="text" name="nome" id="inome" minlength="5" maxlength="20" required>
            </div>
            <div>
                <label for="iemail">E-mail:</label>
                <input type="email" name="email" id="iemail" autocomplete="email" required>
            </div>
            <div>
                <label for="itel">Telefone:</label>
                <input type="tel" name="tel" id="itel" autocomplete="tel" pattern="^\(\d{2}\)\d{4,5}-\d{4,5}$" required placeholder="(xx)xxxx-xxxx">
            </div>
        
        <!-- Estudar mais sobre RegEx
         
            HTML5 patterns-->
        <div>
            <input type="submit" value="Cadastrar" class="botao">
            <input type="reset" value="Limpar" class="botao">
        </div>
        </fieldset>
    </form>
</body>
</html>
