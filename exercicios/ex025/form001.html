<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        form,p {
            padding: 10px;

        }

        #container {
            background-color: rgba(252, 179, 179, 0.829);
            max-width: 400px;
            margin: auto;
            border: 1px solid black;
            border-radius: 10px;
        }

        input {
            border: 1px solid crimson;
            border-radius: 4px;
            background-color: lightgray;
        }

        #container p{
            color: rgb(13, 29, 43);
            text-align: center;
            font-size: 1.1em;
        }

        .submit {
            padding: 10px;
            font-size: 1.2em;
        }

    </style>
</head>
<body>
    <h1>Meu primeiro formulario</h1>
    <div id="container">
        <form action="cadastro.php" method="post" autocomplete="off">
            <p><label for="inome">Nome:</label> <input type="text" name="nome" id="inome" required></p>
        
            <p><label for="isobrenome">Sobrenome:</label> <input type="text" name="sobrenome" id="isobrenome"></p>
            
            <p><label for="isenha">Senha:</label> <input type="password" name="senha" id="isenha"></p>
            
            <p><input type="submit" value="Cadastrar" class="submit" required></p>
        </form>
    </div>
</body>
</html>
