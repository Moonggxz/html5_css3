<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'animeacebb';
            src: url('fonts/animeace2bb_ot/animeace2_bld.otf') format('opentype'),
                url('fonts/animeace2bb_tt/animeace2_bld.ttf') format('truetype'), ;
            font-weight: normal;
            font-style: normal;

            /*Tipos de format()
                - opentype (otf)
                - truetype (ttf)
                - embedded-opentype
                - truetype-aat (Apple Advanced Typography)
                - svg  
            */
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-family: 'animeacebb', Times, serif;
            font-size: 3em;
        }
    </style>
</head>

<body>
    <h1>Olá, Mundo</h1>
    <ol>
        <li>
            <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Aspernatur fugiat, ex fugit laudantium natus
                ipsum ab
                recusandae iure cupiditate ipsa obcaecati accusamus modi veritatis magni labore ea nostrum distinctio.
                Maiores.
            </p>
        </li>
    </ol>
</body>

</html>
